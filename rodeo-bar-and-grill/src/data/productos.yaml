# Productos del menú de The Rodeo Bar And Grill.
# Fuente: fotos del menú impreso y de la carta de bar (Google Drive → PROYECTOS/RODEO), 2026-10-19.
# El orden de este archivo es el orden en el menú.
#
# Campos:
#   id          identificador único (minúsculas y guiones)
#   categoria   id de una categoría de categorias.yaml
#   numero      número del plato en el menú impreso (opcional)
#   nombre      nombre tal como aparece en el menú
#   descripcion texto del menú (opcional)
#   precio      precio en dólares, solo el número (14.99)
#   opciones    variantes con su propio precio: - { nombre: ..., precio: ... }
#               (si una opción no tiene precio conocido, se omite "precio")
#               ¡Ojo! Si el nombre lleva coma, va entre comillas: { nombre: "Pastor, asada", precio: 9.99 }
#   carnes      lista "choice of meat" del menú
#   lista       lista simple (cervezas, sabores…)
#   etiquetas   favorite (★ Favorite en el menú), new (New!), angus (sello Certified Angus Beef),
#               weekend (solo fin de semana)
#   foto        archivo de src/assets/platos/ sin .jpg
#   revisar     nota interna para confirmar con el cliente (NO se publica)
# Sin precio ni opciones con precio, el sitio muestra "Ask your server".

